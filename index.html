<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yawp</title>
<meta name="robots" content="noindex">
<meta name="description" content="Yawp — privacy policy and support.">
<style>
  :root { --ink:#0B0C0E; --text:#E8E9EA; --text-2:#9BA1AA; --accent:#E03A46; --rule:#23262C; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --ink:#EDEDEB; --text:#14161A; --text-2:#3B4149; --accent:#C42734; --rule:#CFCFCB; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         background:var(--ink); color:var(--text);
         font-family:Georgia,"Times New Roman",serif; line-height:1.6; }
  main { max-width:34rem; margin:0 auto; padding:48px 24px; }
  .logo { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .logo span { font-family:system-ui,sans-serif; font-weight:900;
               font-size:17px; letter-spacing:.38em; }
  path { stroke:var(--accent); stroke-width:2.4; fill:none;
         stroke-linecap:square; stroke-linejoin:miter; }
  p { color:var(--text-2); margin:0 0 26px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--rule); }
  li { border-bottom:1px solid var(--rule); }
  a { display:block; padding:16px 0; color:var(--accent); font-size:18px;
      text-decoration:none; }
  a:hover { text-decoration:underline; }
  small { display:block; margin-top:34px; color:var(--text-2); font-size:13px; }
</style>
<main>
  <div class="logo">
    <svg width="46" height="26" viewBox="0 0 46 26" role="img" aria-label="Yawp">
      <path d="M0 16 L7 16 L9.5 12 L12 16 L17 16 L20.5 3 L24 24 L27 16 L33 16 L35 13.5 L37 16 L46 16"/>
    </svg>
    <span>YAWP</span>
  </div>
  <p>Recovery, sleep and heart-rate insight from a Bluetooth strap you already
    own. Computed on your phone.</p>
  <ul>
    <li><a href="/privacy">Privacy policy</a></li>
    <li><a href="/support">Support</a></li>
  </ul>
  <small>Not a medical device. Not affiliated with any strap manufacturer.</small>
</main>
</html>
